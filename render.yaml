services:
  - type: web
    name: assetflow-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install && npm run build --workspace=@assetflow/api
    startCommand: npm run start --workspace=@assetflow/api
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: assetflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: assetflow-cache
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: assetflow-cache
    plan: free
    region: virginia
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
    ipAllowList: []

  - type: worker
    name: assetflow-worker
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install && npm run build --workspace=@assetflow/api
    startCommand: node apps/api/dist/worker.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: assetflow-db
          property: connectionString

  - type: web
    name: assetflow-ai-service
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r apps/ai-service/requirements.txt
    startCommand: uvicorn apps.ai-service.main:app --host 0.0.0.0 --port 10000

defaults:
  region: virginia

databases:
  - name: assetflow-db
    plan: free
    postgresMajorVersion: 16
