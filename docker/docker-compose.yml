version: '3.8'

services:
  # ============================================
  # DATABASES
  # ============================================
  
  postgres:
    image: postgres:15-alpine
    container_name: assetflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: assetflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      POSTGRES_DB: assetflow
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetflow -d assetflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - assetflow-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres-replica:
    image: postgres:15-alpine
    container_name: assetflow-postgres-replica
    restart: unless-stopped
    environment:
      POSTGRES_USER: assetflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      POSTGRES_DB: assetflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      - postgres
    networks:
      - assetflow-network
    profiles:
      - replica
      - production

  redis:
    image: redis:7-alpine
    container_name: assetflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - assetflow-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: assetflow-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - assetflow-network
    profiles:
      - dev
      - monitoring

  # ============================================
  # MESSAGE QUEUE
  # ============================================
  
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: assetflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-assetflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secure_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - assetflow-network
    profiles:
      - production
      - enterprise

  # ============================================
  # BLOCKCHAIN NODE (Development)
  # ============================================
  
  hardhat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.hardhat
    container_name: assetflow-hardhat
    restart: unless-stopped
    ports:
      - "8545:8545"
    volumes:
      - ../contracts:/app
      - hardhat_data:/app/data
    environment:
      NODE_ENV: development
      HARDHAT_NETWORK: hardhat
    networks:
      - assetflow-network
    profiles:
      - dev
      - blockchain

  # ============================================
  # APPLICATION SERVICES
  # ============================================
  
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        NODE_ENV: ${NODE_ENV:-development}
    container_name: assetflow-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://assetflow:${DB_PASSWORD:-secure_password}@postgres:5432/assetflow
      DATABASE_REPLICA_URL: postgresql://assetflow:${DB_PASSWORD:-secure_password}@postgres-replica:5432/assetflow
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-assetflow}:${RABBITMQ_PASSWORD:-secure_password}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-dev_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WEB3_PROVIDER: ${WEB3_PROVIDER:-http://hardhat:8545}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-assetflow-uploads}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
        required: false
    volumes:
      - ../apps/api:/app
      - /app/node_modules
      - api_logs:/var/log/assetflow
    networks:
      - assetflow-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ai-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    container_name: assetflow-ai
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://assetflow:${DB_PASSWORD:-secure_password}@postgres:5432/assetflow
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4-turbo-preview}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGIN:-*}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/ai-service:/app
      - ai_models:/app/models
      - ai_uploads:/app/uploads
    networks:
      - assetflow-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NODE_ENV: ${NODE_ENV:-development}
    container_name: assetflow-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_AI_URL: ${NEXT_PUBLIC_AI_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
      NEXT_PUBLIC_ENVIRONMENT: ${NODE_ENV:-development}
      NEXT_PUBLIC_ANALYTICS_ID: ${NEXT_PUBLIC_ANALYTICS_ID:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
      - ai-service
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    networks:
      - assetflow-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
      args:
        NODE_ENV: ${NODE_ENV:-development}
    container_name: assetflow-admin
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      API_URL: http://api:3001
    ports:
      - "3002:3002"
    depends_on:
      - api
    volumes:
      - ../apps/admin:/app
      - /app/node_modules
    networks:
      - assetflow-network
    profiles:
      - admin
      - enterprise

  # ============================================
  # MONITORING SERVICES
  # ============================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: assetflow-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - assetflow-network
    profiles:
      - monitoring
      - production

  grafana:
    image: grafana/grafana:latest
    container_name: assetflow-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3003:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - assetflow-network
    profiles:
      - monitoring
      - production

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: assetflow-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - assetflow-network
    profiles:
      - monitoring
      - enterprise

  logstash:
    image: docker.elastic.co/logstash/logstash:8.10.2
    container_name: assetflow-logstash
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - api_logs:/var/log/assetflow
    depends_on:
      - elasticsearch
    networks:
      - assetflow-network
    profiles:
      - monitoring
      - enterprise

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.2
    container_name: assetflow-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - assetflow-network
    profiles:
      - monitoring
      - enterprise

  # ============================================
  # NGINX (Production)
  # ============================================
  
  nginx:
    image: nginx:alpine
    container_name: assetflow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - ../apps/web/out:/usr/share/nginx/html
    depends_on:
      - web
      - api
      - ai-service
    networks:
      - assetflow-network
    profiles:
      - production
      - nginx

# ============================================
# VOLUMES
# ============================================

volumes:
  postgres_data:
    driver: local
  postgres_replica_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  hardhat_data:
    driver: local
  api_logs:
    driver: local
  ai_models:
    driver: local
  ai_uploads:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

# ============================================
# NETWORKS
# ============================================

networks:
  assetflow-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16