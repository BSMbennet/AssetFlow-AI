# ============================================
# ASSETFLOW AI - Production Prometheus
# ============================================

global:
  scrape_interval: 10s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    environment: production

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
    - static_configs:
        - targets:
          - alertmanager-prod:9093

rule_files:
  - /etc/prometheus/alert.rules.yml
  - /etc/prometheus/recording.rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'assetflow-api'
    scrape_interval: 5s
    scrape_timeout: 3s
    metrics_path: '/metrics'
    static_configs:
      - targets:
        - 'api:3001'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)'
        replacement: '${1}'

  - job_name: 'assetflow-ai'
    scrape_interval: 5s
    scrape_timeout: 3s
    metrics_path: '/metrics'
    static_configs:
      - targets:
        - 'ai-service:8000'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)'
        replacement: '${1}'

  - job_name: 'assetflow-web'
    scrape_interval: 10s
    static_configs:
      - targets:
        - 'web:3000'

  - job_name: 'node-exporter'
    scrape_interval: 10s
    static_configs:
      - targets:
        - 'node-exporter:9100'

  - job_name: 'redis'
    scrape_interval: 10s
    static_configs:
      - targets:
        - 'redis:6379'

  - job_name: 'postgresql'
    scrape_interval: 10s
    static_configs:
      - targets:
        - 'postgres:5432'

  - job_name: 'nginx'
    scrape_interval: 10s
    static_configs:
      - targets:
        - 'nginx:80/nginx_status'