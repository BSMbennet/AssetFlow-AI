# ============================================
# RELEASE WORKFLOW
# ============================================

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.2.3)'
        required: true
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean
      target_branch:
        description: 'Target branch for release'
        required: false
        default: 'main'
        type: string

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.target_branch }}
        fetch-depth: 0
    
    - name: Validate version
      run: |
        if [[ ! ${{ github.event.inputs.version }} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid version format. Use v1.2.3"
          exit 1
        fi
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Update package.json version
      run: |
        VERSION=${{ github.event.inputs.version }}
        VERSION=${VERSION#v}
        npm version $VERSION --no-git-tag-version
        git add package.json apps/*/package.json packages/*/package.json
        git commit -m "chore: bump version to $VERSION"
    
    - name: Generate changelog
      run: |
        npx conventional-changelog -p angular -i CHANGELOG.md -s -r 0
        git add CHANGELOG.md
        git commit -m "docs: update changelog"
    
    - name: Push changes
      run: |
        git push origin ${{ github.event.inputs.target_branch }}
        git tag ${{ github.event.inputs.version }}
        git push origin ${{ github.event.inputs.version }}
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: Release ${{ github.event.inputs.version }}
        draft: false
        prerelease: ${{ github.event.inputs.prerelease }}
        generate_release_notes: true
        files: |
          CHANGELOG.md
          README.md
      
    - name: Build release artifacts
      run: |
        npm run build
        cd contracts && npm run compile
        tar -czf assetflow-contracts-${{ github.event.inputs.version }}.tar.gz contracts/artifacts
        
    - name: Upload artifacts to release
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./assetflow-contracts-${{ github.event.inputs.version }}.tar.gz
        asset_name: assetflow-contracts-${{ github.event.inputs.version }}.tar.gz
        asset_content_type: application/gzip

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: release
    if: always()
    
    steps:
    - name: Send notification to Slack
      uses: slackapi/slack-github-action@v1.24.0
      with:
        channel-id: 'C04TZSLP1J6'
        slack-message: |
          🚀 *New Release: ${{ github.event.inputs.version }}*
          Status: ${{ needs.release.result }}
          Repository: ${{ github.repository }}
          Author: ${{ github.actor }}
          URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.version }}
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}