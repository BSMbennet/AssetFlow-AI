# ============================================
# REPOSITORY SETTINGS
# ============================================

repository:
  name: assetflow-ai
  description: Enterprise-grade RWA Tokenization Platform powered by AI
  homepage: https://assetflow.ai
  topics: rwa, tokenization, blockchain, ai, defi, compliance
  private: false
  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: true
  has_discussions: true
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
  delete_branch_on_merge: true

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
      required_status_checks:
        strict: true
        contexts:
          - "build"
          - "test"
          - "security"
          - "deploy/staging"
      enforce_admins: true
      restrictions:
        users: []
        teams: ["platform-team"]
  
  - name: develop
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
      required_status_checks:
        strict: true
        contexts:
          - "build"
          - "test"
          - "security"
      enforce_admins: false

labels:
  - name: "bug"
    color: "d73a4a"
  - name: "enhancement"
    color: "a2eeef"
  - name: "documentation"
    color: "0075ca"
  - name: "security"
    color: "b60205"
  - name: "critical"
    color: "b60205"
  - name: "high-priority"
    color: "d93f0b"
  - name: "medium-priority"
    color: "fbca04"
  - name: "low-priority"
    color: "0e8a16"

teams:
  - name: platform-team
    permission: admin
  - name: backend-team
    permission: push
  - name: frontend-team
    permission: push
  - name: ai-team
    permission: push
  - name: devops-team
    permission: push
  - name: security-team
    permission: triage

collaborators:
  - username: developer1
    permission: push
  - username: developer2
    permission: push