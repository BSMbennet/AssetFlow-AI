# ============================================
# ASSETFLOW AI - AI Service Secrets
# ============================================

apiVersion: v1
kind: Secret
metadata:
  name: ai-secrets
  namespace: assetflow
  labels:
    app: assetflow
    component: ai
type: Opaque
stringData:
  database_url: "postgresql://assetflow:${DB_PASSWORD}@postgres:5432/assetflow"
  redis_url: "redis://:${REDIS_PASSWORD}@redis:6379"
  openai_api_key: "${OPENAI_API_KEY}"
  aws_access_key_id: "${AWS_ACCESS_KEY_ID}"
  aws_secret_access_key: "${AWS_SECRET_ACCESS_KEY}"