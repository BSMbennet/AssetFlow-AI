# ============================================
# ASSETFLOW AI - API Secrets
# ============================================

apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: assetflow
  labels:
    app: assetflow
    component: api
type: Opaque
stringData:
  database_url: "postgresql://assetflow:${DB_PASSWORD}@postgres:5432/assetflow"
  database_replica_url: "postgresql://assetflow:${DB_PASSWORD}@postgres-replica:5432/assetflow"
  redis_url: "redis://:${REDIS_PASSWORD}@redis:6379"
  jwt_secret: "${JWT_SECRET}"
  rabbitmq_url: "amqp://assetflow:${RABBITMQ_PASSWORD}@rabbitmq:5672"
  openai_api_key: "${OPENAI_API_KEY}"
  aws_access_key_id: "${AWS_ACCESS_KEY_ID}"
  aws_secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
  sentry_dsn: "${SENTRY_DSN}"
  slack_webhook_url: "${SLACK_WEBHOOK_URL}"