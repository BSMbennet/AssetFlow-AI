# ============================================
# ASSETFLOW AI - Ingress Configuration
# ============================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assetflow-ingress
  namespace: assetflow
  labels:
    app: assetflow
    component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/rewrite-target: "/"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - assetflow.ai
    - www.assetflow.ai
    - api.assetflow.ai
    - ai.assetflow.ai
    secretName: assetflow-tls
  rules:
  - host: assetflow.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: assetflow-web
            port:
              number: 3000
  - host: www.assetflow.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: assetflow-web
            port:
              number: 3000
  - host: api.assetflow.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: assetflow-api
            port:
              number: 3001
  - host: ai.assetflow.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: assetflow-ai
            port:
              number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assetflow-ingress-dev
  namespace: assetflow-dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: dev.assetflow.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: assetflow-web
            port:
              number: 3000