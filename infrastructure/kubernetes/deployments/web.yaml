# ============================================
# ASSETFLOW AI - Web Application Deployment
# ============================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: assetflow-web
  namespace: assetflow
  labels:
    app: assetflow-web
    tier: frontend
    component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: assetflow-web
  template:
    metadata:
      labels:
        app: assetflow-web
        tier: frontend
        component: web
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: assetflow-web
              topologyKey: kubernetes.io/hostname
      containers:
      - name: web
        image: assetflow/web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: web-config
              key: node_env
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: web-config
              key: api_url
        - name: NEXT_PUBLIC_AI_URL
          valueFrom:
            configMapKeyRef:
              name: web-config
              key: ai_url
        - name: NEXT_PUBLIC_WS_URL
          valueFrom:
            configMapKeyRef:
              name: web-config
              key: ws_url
        - name: NEXT_PUBLIC_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: web-config
              key: environment
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      terminationGracePeriodSeconds: 30
      serviceAccountName: assetflow-web-sa
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: assetflow-web-hpa
  namespace: assetflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: assetflow-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70